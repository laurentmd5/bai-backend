# =============================================================================
# BARROW.AI POC - Development Docker Compose
# =============================================================================

version: '3.8'

networks:
  barrow-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: barrow-postgres-dev
    restart: unless-stopped
    networks:
      - barrow-net
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: barrowai
      POSTGRES_PASSWORD: barrowai_dev_2024
      POSTGRES_DB: barrowai_poc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barrowai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: barrow-redis-dev
    restart: unless-stopped
    networks:
      - barrow-net
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass redis_dev_2024

  qdrant:
    image: qdrant/qdrant:latest
    container_name: barrow-qdrant-dev
    restart: unless-stopped
    networks:
      - barrow-net
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: barrow:${BUILD_NUMBER:-latest}
    container_name: barrow-backend-dev
    restart: unless-stopped
    networks:
      - barrow-net
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started