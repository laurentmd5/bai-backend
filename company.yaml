    7. **Fire Safety**: Addressable fire detection, automatic gas/water suppression systems, evacuation planning, staff training.
    8. **Software & Custom ERP**: Odoo ERP integration, custom business management software (Node.js, React, Python), CRM, mobile apps.
    9. **IPTV & Audiovisual Systems**: Professional IPTV (hotels, residential), digital signage, video conferencing, sound systems.

