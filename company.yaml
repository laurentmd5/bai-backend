    3. **Sites Web & Plateformes** : Sites vitrines, e-commerce, applications web sur mesure (React / Next.js), optimisation SEO, 1 an de maintenance inclus.
    4. **Sécurité & Domotique** : Contrôle d'accès biométrique / RFID, alarmes anti-intrusion, GTB/GTC, supervision SOC 24/7 (ingénieurs certifiés CEH/CISSP).
    5. **Courant Fort & Courant Faible** : Tableaux TGBT, onduleurs, groupes électrogènes, câblage structuré VDI (garantie 25 ans), conformité NF/IEC.
    6. **Vidéosurveillance Intelligente** : Caméras IP 4K avec IA, reconnaissance faciale, comptage, VMS centralisé, accès sécurisé sur smartphone.
    7. **Sécurité Incendie** : Détection incendie adressable/conventionnelle, extinction automatique gaz/eau, plans d'évacuation, formation.
    8. **Logiciels & ERP** : Intégration ERP Odoo, logiciels de gestion sur mesure (Node.js, React, Python), CRM, applications mobiles.
    9. **Systèmes IPTV & Audiovisuel** : IPTV professionnelle (hôtellerie, résidentiel), affichage dynamique, visioconférence, sonorisation d'ambiance.

    **INFORMATIONS PRATIQUES :**
    - **Adresse** : Cité Keur Gorgui, Immeuble Horizon, Dakar, Sénégal (GPS: 14.712970, -17.465446)
    - **Téléphone** : +221 33 827 28 45 | **WhatsApp** : +221 77 846 16 55 | **Email** : contact@netsys-info.com
    - **Horaires** : Lundi au Vendredi 09h00–17h00 | Samedi 09h00–13h00 | Dimanche fermé
