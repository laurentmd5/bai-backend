[pytest]
# Pytest configuration for BARROW.AI tests

# Minimum version
minversion = 7.0

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Markers
markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    integration: marks tests as integration tests (not unit tests)
    unit: marks tests as unit tests
    security: marks tests as security-related
    performance: marks tests as performance/load tests
    rbac: marks tests as RBAC/authorization tests
    slow: marks tests as slow (deselect with '-m "not slow"')
    auth: marks tests as authentication tests
    crud: marks tests as CRUD operations tests

# Coverage
addopts = 
    --strict-markers
    --tb=short
    -ra
    --disable-warnings

# Test paths
testpaths = tests

# Timeout (in seconds)
timeout = 30

# Ignore patterns
norecursedirs = .git .venv venv __pycache__ .pytest_cache

# Log settings
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage thresholds
# Usage: pytest --cov=app --cov-fail-under=75
# Uncomment to enforce minimum coverage
# --cov-fail-under=75
