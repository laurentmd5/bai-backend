{% extends "base.html" %}
{% block title %}Détail conversation{% endblock %}
{% block page_title %}Détail de la conversation{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm p-6">
    <div id="conv-detail">
        <div class="text-center py-8">Chargement...</div>
    </div>
</div>

<script>
    const convId = '{{ conv_id }}';
    async function loadDetail() {
        const token = localStorage.getItem('access_token');
        const res = await fetch(`/api/v1/admin/conversations/${convId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const conv = await res.json();
            renderDetail(conv);
        } else if (res.status === 401) {
            window.location.href = '/admin/login';
        }
    }
    
    function renderDetail(conv) {
        const html = `
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div><span class="font-bold">Session:</span> ${conv.session_id}</div>
                    <div><span class="font-bold">Date:</span> ${formatDate(conv.created_at)}</div>
                    <div><span class="font-bold">Confiance:</span> ${((conv.confidence || 0) * 100).toFixed(0)}%</div>
                    <div><span class="font-bold">Temps de réponse:</span> ${conv.latency_ms || 0}ms</div>
                </div>
                <div class="mt-6">
                    <h3 class="font-bold mb-2">Message utilisateur:</h3>
                    <p class="bg-blue-50 p-4 rounded">${escapeHtml(conv.user_message)}</p>
                </div>
                <div>
                    <h3 class="font-bold mb-2">Réponse du bot:</h3>
                    <p class="bg-green-50 p-4 rounded">${escapeHtml(conv.bot_response)}</p>
                </div>
                ${conv.sources && conv.sources.length ? `
                <div>
                    <h3 class="font-bold mb-2">Sources utilisées:</h3>
                    <ul class="bg-gray-50 p-4 rounded space-y-2">
                        ${conv.sources.map(s => `<li><strong>${escapeHtml(s.doc_name)}</strong> (Section: ${escapeHtml(s.section)}, Relevance: ${(s.relevance * 100).toFixed(0)}%)</li>`).join('')}
                    </ul>
                </div>
                ` : ''}
                <button onclick="window.location.href='/admin/conversations'" class="btn btn-secondary mt-4">Retour</button>
            </div>
        `;
        document.getElementById('conv-detail').innerHTML = html;
    }
    
    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;') : ''; }
    loadDetail();
</script>
{% endblock %}
