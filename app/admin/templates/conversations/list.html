{% extends "base.html" %}
{% block title %}Conversations{% endblock %}
{% block page_title %}Conversations{% endblock %}
{% block content %}
<div class="bg-white rounded-xl shadow-sm p-6">
    <div class="mb-6">
        <h3 class="text-lg font-semibold">Conversations récentes</h3>
    </div>
    <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
            <thead class="bg-gray-100">
                <tr><th class="px-4 py-2">Session</th><th class="px-4 py-2">Message</th><th class="px-4 py-2">Réponse</th><th class="px-4 py-2">Confiance</th><th class="px-4 py-2">Date</th><th class="px-4 py-2">Actions</th></tr>
            </thead>
            <tbody id="conv-tbody">
                <tr><td colspan="6" class="text-center py-4">Chargement...</td></tr>
            </tbody>
        </table>
    </div>
    <div id="conv-pagination" class="mt-4 flex justify-between"></div>
</div>

<script>
    let convPage = 0;
    const convLimit = 15;
    
    async function loadConversations(page = 0) {
        const token = localStorage.getItem('access_token');
        const offset = page * convLimit;
        const res = await fetch(`/api/v1/admin/conversations?limit=${convLimit}&offset=${offset}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
            const data = await res.json();
            renderConversations(data.conversations);
            renderConvPagination(data.total, page);
            convPage = page;
        } else if (res.status === 401) window.location.href = '/admin/login';
    }
    
    function renderConversations(convs) {
        const tbody = document.getElementById('conv-tbody');
        if (!convs.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">Aucune conversation</td></tr>';
            return;
        }
        tbody.innerHTML = convs.map(c => `
            <tr>
                <td class="border-b px-4 py-2">${c.session_id ? c.session_id.substring(0, 8) : '-'}</td>
                <td class="border-b px-4 py-2">${escapeHtml((c.user_message || '').substring(0, 50))}</td>
                <td class="border-b px-4 py-2">${escapeHtml((c.bot_response || '').substring(0, 50))}</td>
                <td class="border-b px-4 py-2">${((c.confidence || 0) * 100).toFixed(0)}%</td>
                <td class="border-b px-4 py-2">${formatDate(c.created_at)}</td>
                <td class="border-b px-4 py-2"><button onclick="viewConv('${c.id}')" class="text-blue-600"><i class="fas fa-eye"></i></button></td>
            </tr>
        `).join('');
    }
    
    function renderConvPagination(total, current) {
        const totalPages = Math.ceil(total / convLimit);
        const container = document.getElementById('conv-pagination');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = '<div class="flex gap-2">';
        if (current > 0) html += `<button onclick="loadConversations(${current-1})" class="px-3 py-1 border rounded">Précédent</button>`;
        html += `<span class="px-3 py-1">Page ${current+1} / ${totalPages}</span>`;
        if (current < totalPages-1) html += `<button onclick="loadConversations(${current+1})" class="px-3 py-1 border rounded">Suivant</button>`;
        html += '</div>';
        container.innerHTML = html;
    }
    
    function viewConv(id) { window.location.href = `/admin/conversations/detail/${id}`; }
    function escapeHtml(str) { return str ? str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;') : ''; }
    loadConversations();
</script>
{% endblock %}
