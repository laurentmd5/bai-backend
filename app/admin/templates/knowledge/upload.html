{% extends "base.html" %}
{% block title %}Upload document{% endblock %}
{% block page_title %}Ajouter un document{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-xl shadow-sm p-8">
    <form id="uploadForm" enctype="multipart/form-data">
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Fichier (PDF, DOCX, TXT, MD)</label>
            <input type="file" name="file" accept=".pdf,.docx,.txt,.md" required class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Titre</label>
            <input type="text" name="title" class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg">
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Description</label>
            <textarea name="description" rows="3" class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
        </div>
        <div class="mb-4">
            <label class="block text-gray-700 font-bold mb-2">Langue</label>
            <select name="language" class="form-input w-full px-3 py-2 border border-gray-300 rounded-lg">
                <option value="en">English</option>
                <option value="fr">Français</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-full">Uploader</button>
    </form>
    <div id="progress" class="mt-4 hidden"><div class="bg-gray-200 rounded-full h-2"><div id="progress-bar" class="bg-emerald-600 h-2 rounded-full" style="width:0%"></div></div><p class="text-sm text-center mt-2">Traitement...</p></div>
    <div id="errorMsg" class="mt-4 text-red-600 text-sm hidden"></div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const token = localStorage.getItem('access_token');
        const progressDiv = document.getElementById('progress');
        const errorDiv = document.getElementById('errorMsg');
        progressDiv.classList.remove('hidden');
        errorDiv.classList.add('hidden');
        
        try {
            const response = await fetch('/api/v1/admin/knowledge', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            if (response.ok) {
                window.location.href = '/admin/knowledge';
            } else {
                const err = await response.json();
                errorDiv.textContent = err.detail || 'Erreur lors de l\'upload';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.textContent = 'Erreur réseau';
            errorDiv.classList.remove('hidden');
        } finally {
            progressDiv.classList.add('hidden');
        }
    });
</script>
{% endblock %}
