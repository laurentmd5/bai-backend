{% extends "base.html" %}
{% block title %}2FA - {{ company.name or 'NETSYSTEME' }} Admin{% endblock %}
{% block page_title %}Vérification 2FA{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white rounded-lg shadow p-8">
    <h2 class="text-2xl font-bold text-center mb-6">Code d'authentification à deux facteurs</h2>
    <p class="text-gray-600 mb-4 text-center">Entrez le code généré par votre application d'authentification.</p>
    <form id="verifyForm">
        <div class="mb-4">
            <input type="text" id="code" name="code" placeholder="000000" autocomplete="off" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-center text-2xl tracking-widest">
        </div>
        <button type="submit" class="btn btn-primary w-full" style="padding:.75rem;font-size:1rem;font-weight:600">Vérifier</button>
    </form>

    <div id="errorMessage" class="mt-4 text-red-600 text-sm text-center hidden"></div>
</div>

<script>
    const tempToken = sessionStorage.getItem('temp_session');
    if (!tempToken) {
        window.location.href = '/admin/login';
    }
    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = document.getElementById('code').value;
        const errorDiv = document.getElementById('errorMessage');
        
        try {
            const response = await fetch('/api/v1/admin/auth/verify-2fa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_token: tempToken, two_factor_code: code })
            });
            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('access_token', data.tokens.access_token);
                localStorage.setItem('refresh_token', data.tokens.refresh_token);
                localStorage.setItem('csrf_token',    data.tokens.csrf_token);
                document.cookie = `access_token=${data.tokens.access_token}; path=/; max-age=900; SameSite=Strict`;
                sessionStorage.removeItem('temp_session');
                window.location.href = '/admin/dashboard';
            } else {
                errorDiv.textContent = data.detail || 'Code invalide';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.textContent = 'Erreur réseau';
            errorDiv.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
