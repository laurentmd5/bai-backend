# =============================================================================
# SRE Alerting Rules for NetBot / BAI Platform
# =============================================================================

groups:
  - name: bai_platform_alerts
    rules:
      # Critical: Application Service Down
      - alert: BackendServiceDown
        expr: up{job="bai-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend service is down"
          description: "FastAPI backend instance {{ $labels.instance }} has been unreachable for more than 1 minute."

      # Critical: High HTTP 5xx Error Rate (> 5%)
      - alert: HighHttpErrorRate
        expr: (sum(rate(bot_http_requests_total{status=~"5.."}[5m])) / sum(rate(bot_http_requests_total[5m]))) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate detected"
          description: "Over 5% of HTTP requests returned 5xx status codes over the last 5 minutes."

      # Warning: RAG Search Latency Degradation (p95 > 2s)
      - alert: RAGSearchLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(bot_rag_retrieval_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAG vector search is slow"
          description: "95th percentile RAG retrieval duration is higher than 2.0 seconds."

      # Warning: High RAG Fallback Rate
      - alert: HighRAGFallbackRate
        expr: sum(rate(bot_rag_fallbacks_total[10m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of low-confidence RAG fallbacks"
          description: "Knowledge base queries are frequently triggering fallbacks due to low confidence."

      # Warning: WhatsApp Voice Processing Failures
      - alert: WhatsAppVoiceProcessingFailures
        expr: sum(rate(bot_voice_message_processed_total{status!="success"}[5m])) > 0.2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Voice message processing errors detected"
          description: "WhatsApp voice messages are failing Whisper transcription or TTS audio synthesis."

      # Warning: Low Cache Hit Ratio (< 40%)
      - alert: LowCacheHitRatio
        expr: bot_cache_hit_ratio < 40 and sum(rate(bot_chat_messages_total[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Redis RAG cache hit ratio is suboptimal"
          description: "Cache hit ratio is below 40%, which may increase LLM latency and costs."
